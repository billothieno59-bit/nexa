[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-africa-operating-system"
version = "0.1.0"
description = "NEXA Africa Operating System"
requires-python = ">=3.11"

dependencies = [
    "jsonschema>=4.18",
    "anthropic>=0.34.0",
    "openai>=1.40.0",
    "elevenlabs>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = [
    "core",
    "skills",
]
pythonpath = [
    ".",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []